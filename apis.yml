- aid: runai:runai-distributed-api
  name: NVIDIA Run:ai Distributed API
  description: "Distributed Training, is the ability to split the training of a model among multiple processors.\
    \ \nIt is often a necessity when multi-GPU training no longer applies; \ntypically when you require more GPUs\
    \ than exist on a single node. \nEach such split is a pod (see definition above). NVIDIA Run:ai spawns an additional\
    \ launcher process that manages and \ncoordinates the other worker pods. For more information, see [Distributed\
    \ training](https://run-ai-docs.nvidia.com/saas/workloads-in-nvidia-run-ai/using-training/distributed-training/distributed-training-models)."
  humanURL: https://run-ai-docs.nvidia.com/api/readme.md
