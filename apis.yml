aid: runai
name: NVIDIA Run:ai
description: NVIDIA Run:ai (formerly run.ai) is an AI operations and GPU orchestration platform for Kubernetes that
  pools, schedules, and governs GPU compute across clusters for training, fine-tuning, and inference workloads.
  It provides fractional GPU sharing, dynamic scheduling, quota and policy management, multi-tenant projects and
  departments, and workload lifecycle control across SaaS, self-hosted, and multi-tenant deployments. run.ai was
  founded in Israel, backed by Insight Partners and other investors, and acquired by NVIDIA in 2024; the product
  is now delivered as NVIDIA Run:ai. Its control-plane REST API exposes programmatic management of clusters, node
  pools, projects, departments, workloads (workspaces, trainings, inferences, distributed), assets, policies, permissions,
  service accounts, and audit logs, authenticated with bearer JWT access tokens obtained from client-credentials
  access keys.
