- aid: runai:runai-nvidia-nim-api
  name: NVIDIA Run:ai NVIDIA NIM API
  description: 'The NVIDIA NIM API provides endpoints to create and manage workloads that deploy NVIDIA Inference
    Microservices (NIM) through the NIM Operator. These workloads package optimized NVIDIA model servers and run
    as managed services on the NVIDIA Run:ai platform.

