        maxReplicas:
          $ref: '#/components/schemas/IntegerRules'
        initialReplicas:
          $ref: '#/components/schemas/IntegerRules'
        activationReplicas:
          $ref: '#/components/schemas/IntegerRules'
        metric:
          $ref: '#/components/schemas/AutoScalingMetricRules'
        metricThreshold:
          $ref: '#/components/schemas/IntegerRules'
        concurrencyHardLimit:
          $ref: '#/components/schemas/IntegerRules'
        scaleToZeroRetentionSeconds:
          $ref: '#/components/schemas/IntegerRules'
        scaleDownDelaySeconds:
          $ref: '#/components/schemas/IntegerRules'
        initializationTimeoutSeconds:
          allOf:
          - $ref: '#/components/schemas/IntegerRules'
          deprecated: true
      type:
      - object
      - 'null'
    GitCommon:
      properties:
        repository:
          description: URL to a remote Git repository. The content of this repository will be mapped to the container running the workload. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
          example: https://github.com/my-git/my-repo
        branch:
          description: Specific branch to synchronize the repository from.
          type:
          - string
          - 'null'
          minLength: 1
          example: main
        revision:
          description: Specific revision to synchronize the repository from.
          type:
          - string
          - 'null'
          minLength: 1
        path:
          description: Local path within the workload to which the Git repository will be mapped (mandatory).
          type:
          - string
          - 'null'
          minLength: 1
          example: /container/my-repository
      type:
      - object
      - 'null'
    LargeShmRequest:
      description: A large /dev/shm device to mount into a container running the created workload. An shm is a shared file system mounted on RAM.
      type:
      - boolean
      - 'null'
      example: false
    PolicyType:
      description: The type of policy which determines the kind of workloads it is affecting
      type: string
      enum:
      - workspace
      - training
      - distributed
      - inference
      - distributedInference
      - nimService
      - fallback
    PvcItems:
      description: Set of pvc persistent volume claims to use in the workload.
      type:
      - array
      - 'null'
      items:
        $ref: '#/components/schemas/PvcInstance'
    PolicyCreationFields:
      required:
      - name
      - scope
      properties:
        scope:
          $ref: '#/components/schemas/ScopeType'
        projectId:
          $ref: '#/components/schemas/ProjectIdOptional'
        departmentId:
          $ref: '#/components/schemas/DepartmentIdOptional'
        clusterId:
          $ref: '#/components/schemas/ClusterIdOptional'
        name:
          $ref: '#/components/schemas/PolicyName'
    DistributedInferenceServingPortAccessAuthorizationTypeEnum:
      type:
      - string
      - 'null'
      description: 'Specifies who can send inference requests to the serving endpoint:


        Possible values:

        - `public`: No authorization is required. (Default)

        - `authenticatedUsers`: Any NVIDIA Run:ai authenticated user and service account can send requests.

        - `authorizedUsers`: Only users listed in the authorizedUsers field can send requests.

        - `authorizedGroups`: Only members of user groups listed in the authorizedGroups field can send requests.

        '
      enum:
      - public
      - authenticatedUsers
      - authorizedUsers
      - authorizedGroups
    Capabilities:
      description: Add POSIX capabilities to running containers. Defaults to the default set of capabilities granted by the container runtime.
      type:
      - array
      - 'null'
      items:
        $ref: '#/components/schemas/Capability'
      example:
      - CHOWN
      - KILL
    DistributedPolicyDefaultsAndRulesV2:
      properties:
        defaults:
          $ref: '#/components/schemas/DistributedPolicyDefaultsV2'
        rules:
          $ref: '#/components/schemas/DistributedPolicyRulesV2'
        imposedAssets:
          $ref: '#/components/schemas/DistributedImposedAssets'
        status:
          $ref: '#/components/schemas/PolicyValidationStatus'
      type:
      - object
      - 'null'
    DistributedInferencePolicyOverwriteRequestV2:
      properties:
        meta:
          $ref: '#/components/schemas/PolicyCreationFields'
        policy:
          $ref: '#/components/schemas/DistributedInferencePolicyDefaultsAndRulesV2'
      type: object
    SecretInstance2:
      allOf:
      - $ref: '#/components/schemas/StorageInstanceName'
      - $ref: '#/components/schemas/Secret5'
      - $ref: '#/components/schemas/ExcludeField'
      type:
      - object
      - 'null'
    ServingPortExposedProtocol:
      description: The protocol to use for the exposed URL. If grpcPort is set, this defaults to grpc. Otherwise, it defaults to http.
      type:
      - string
      - 'null'
      enum:
      - http
      - grpc
    UidGidSourceOptions:
      properties:
        options:
          description: Limit the permitted values for uidGidSource to a given set of values.
          type:
          - array
          - 'null'
          items:
            required:
            - value
            properties:
              value:
                $ref: '#/components/schemas/UidGidSource'
              displayed:
                description: Textual description of the value
                type:
                - string
                - 'null'
                pattern: .*
      type:
      - object
      - 'null'
    ImposedAssets:
      description: a list of datasource assets to import into the policy. these datasources will be included in any workload that will be created in the scope of the policy.
      type:
      - array
      - 'null'
      items:
        type: string
        format: uuid
    CpuCoreRequest:
      description: CPU units to allocate for the created workload (0.5, 1, .etc). The workload will receive at least this amount of CPU. Note that the workload will not be scheduled unless the system can guarantee this amount of CPUs to the workload.
      format: double
      type:
      - number
      - 'null'
      example: 0.5
      minimum: 0
    DistributedInferenceImposedAssets:
      properties:
        leader:
          $ref: '#/components/schemas/ImposedAssets'
        worker:
          $ref: '#/components/schemas/ImposedAssets'
      type:
      - object
      - 'null'
    WorkspacePolicyOverwriteRequestV2:
      properties:
        meta:
          $ref: '#/components/schemas/PolicyCreationFields'
        policy:
          $ref: '#/components/schemas/WorkspacePolicyDefaultsAndRulesV2'
      type: object
    ConfigMapsDefaults:
      properties:
        attributes:
          $ref: '#/components/schemas/ConfigMapInstance'
        instances:
          $ref: '#/components/schemas/ConfigMapItems'
      type:
      - object
      - 'null'
    SecretItems1:
      description: Set of secret volumes to use in the workload
      type:
      - array
      - 'null'
      items:
        $ref: '#/components/schemas/SecretInstance2'
    S3Items:
      description: Set of s3 buckets to use in the workload.
      type:
      - array
      - 'null'
      items:
        $ref: '#/components/schemas/S3Instance'
    FieldsToReset:
      description: set of fields in jsonpath format that is requested to clear their policy (default and rules)
      type: array
      items:
        type: string
        pattern: .*
      example:
      - master.security.runAsGpu
      - worker.compute.gpu
    PriorityClass:
      description: 'Specifies the priority class for the workload, which determines its scheduling behavior. Valid values are: very-low, low, medium-low, medium, medium-high, high, and very-high. Each workload type has a default priority. To view the default priority for each workload type, use the GET /workload-types endpoint. Once you change the priority from the default value defined for that workload type, the preemptibility field is not automatically updated. Make sure to set the desired preemptibility value.'
      type:
      - string
      - 'null'
      pattern: .*
    Error:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          minimum: 100
          maximum: 599
        message:
          type: string
        details:
          type: string
      example:
        code: 400
        message: Bad request - Resource should have a name
    RelatedUrlsDefaults:
      properties:
        attributes:
          $ref: '#/components/schemas/RelatedUrl'
        instances:
          $ref: '#/components/schemas/RelatedUrls'
      type:
      - object
      - 'null'
    AutoScalingMetric:
      description: The metric to use for autoscaling. Mandatory if minReplicas < maxReplicas, except for the special case where minReplicas is set to 0 and maxReplicas is set to 1, as in this case autoscaling decisions are made according to network activity rather than metrics. Use one of the built-in metrics of 'throughput', 'concurrency' or 'latency', or any other available custom metric. Only the 'throughput' and 'concurrency' metrics support scale-to-zero
      type:
      - string
      - 'null'
      pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
      example: http_requests_total
    Probes:
      description: Probes are used to determine if the container is healthy and ready to accept traffic.
      type:
      - object
      - 'null'
      properties:
        readiness:
          $ref: '#/components/schemas/Probe'
    PolicyListResponse:
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/PolicyListEntry'
    Nfs:
      properties:
        path:
          description: Path that is exported by the NFS server (mandatory). For more information, see [NFS](https://kubernetes.io/docs/concepts/storage/volumes#nfs).
          type:
          - string
          - 'null'
          minLength: 1
          example: /container/nfs
          pattern: .*
        readOnly:
          description: Force the NFS export to be mounted with read-only permissions.
          type:
          - boolean
          - 'null'
          default: true
        server:
          description: The hostname or IP address of the NFS server. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
          example: my.nfs.com
          pattern: .*
        mountPath:
          description: The path that the NFS volume will be mounted to when in use. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
          example: /local/nfs
          pattern: .*
      type:
      - object
      - 'null'
    GpuMemoryRequest:
      description: Required if and only if gpuRequestType is memory. States the GPU memory to allocate for the created workload, per GPU device. Note that the workload will not be scheduled unless the system can guarantee this amount of GPU memory to the workload.
      type:
      - string
      - 'null'
      pattern: ^([+]?[0-9.]+)([eEinumkKMGTP]*[-+]?[0-9]*)$
      example: 10M
    NimServicePolicyDefaultsAndRules:
      properties:
        defaults:
          allOf:
          - $ref: '#/components/schemas/NimServiceDefaults'
          type:
          - object
          - 'null'
        rules:
          allOf:
          - $ref: '#/components/schemas/NimServiceRules'
          type:
          - object
          - 'null'
        status:
          $ref: '#/components/schemas/PolicyValidationStatus'
      type:
      - object
      - 'null'
    InferencePolicyChangeRequestV2:
      properties:
        meta:
          $ref: '#/components/schemas/PolicyCreationFields'
        policy:
          $ref: '#/components/schemas/InferencePolicyDefaultsAndRulesV2'
        reset:
          $ref: '#/components/schemas/FieldsToReset'
      type: object
    EnvironmentVariable:
      description: Details of an environment variable which is populated into the container.
      properties:
        name:
          description: The name of the environment variable. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
          example: HOME
          pattern: .*
        value:
          description: The value of the environment variable. (mutually exclusive with secret, userCredential, configMap and podFieldRef)
          type:
          - string
          - 'null'
          example: /home/my-folder
          pattern: .*
        secret:
          $ref: '#/components/schemas/EnvironmentVariableSecret'
        configMap:
          $ref: '#/components/schemas/EnvironmentVariableConfigMap'
        podFieldRef:
          $ref: '#/components/schemas/EnvironmentVariablePodFieldReference'
        userCredential:
          $ref: '#/components/schemas/EnvironmentVariableUserCredential'
        exclude:
          description: Use 'true' in case the environment variable is defined in defaults of the policy, and you wish to exclude it from the workload.
          type:
          - boolean
          - 'null'
          example: false
        description:
          description: Description of the environment variable.
          type:
          - string
          - 'null'
          example: Home directory of the user.
          pattern: .*
      type:
      - object
      - 'null'
    PreemptibilityRules:
      allOf:
      - $ref: '#/components/schemas/StringRulesCommon'
      - $ref: '#/components/schemas/PreemptibilityOptions'
      type:
      - object
      - 'null'
    InferencePolicyRulesV2:
      allOf:
      - properties:
          annotations:
            $ref: '#/components/schemas/InstancesRules'
          args:
            $ref: '#/components/schemas/StringRules'
          category:
            $ref: '#/components/schemas/StringRules'
          command:
            $ref: '#/components/schemas/StringRules'
          compute:
            properties:
              cpuCoreLimit:
                $ref: '#/components/schemas/NumberRules'
              cpuCoreRequest:
                $ref: '#/components/schemas/NumberRules'
              cpuMemoryLimit:
                $ref: '#/components/schemas/QuantityRules'
              cpuMemoryRequest:
                $ref: '#/components/schemas/QuantityRules'
              extendedResources:
                $ref: '#/components/schemas/ExtendedResourcesRules'
              gpuDevicesRequest:
                $ref: '#/components/schemas/IntegerRules'
              gpuMemoryLimit:
                $ref: '#/components/schemas/QuantityRules'
              gpuMemoryRequest:
                $ref: '#/components/schemas/QuantityRules'
              gpuPortionLimit:
                $ref: '#/components/schemas/NumberRules'
              gpuPortionRequest:
                $ref: '#/components/schemas/NumberRules'
              gpuRequestType:
                $ref: '#/components/schemas/GpuRequestRules'
              largeShmRequest:
                $ref: '#/components/schemas/BooleanRules'
            type:
            - object
            - 'null'
          createHomeDir:
            $ref: '#/components/schemas/BooleanRules'
          environmentVariables:
            $ref: '#/components/schemas/InstancesRules'
          exposedUrls:
