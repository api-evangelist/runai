          - 'null'
      type:
      - object
      - 'null'
    GitRules:
      properties:
        repository:
          $ref: '#/components/schemas/StringRules'
        branch:
          $ref: '#/components/schemas/StringRules'
        revision:
          $ref: '#/components/schemas/StringRules'
        path:
          $ref: '#/components/schemas/StringRules'
      type:
      - object
      - 'null'
    InferencePolicyDefaultsAndRulesV2:
      properties:
        defaults:
          allOf:
          - $ref: '#/components/schemas/InferencePolicyDefaultsV2'
          type:
          - object
          - 'null'
        rules:
          allOf:
          - $ref: '#/components/schemas/InferencePolicyRulesV2'
          type:
          - object
          - 'null'
        imposedAssets:
          $ref: '#/components/schemas/ImposedAssets'
        status:
          $ref: '#/components/schemas/PolicyValidationStatus'
      type:
      - object
      - 'null'
    HostPath:
      properties:
        path:
          description: Local path within the controller to which the host volume will be mapped. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
          example: /container/directory
          pattern: .*
        readOnly:
          description: Force the volume to be mounted with read-only permissions. Defaults to false.
          type:
          - boolean
          - 'null'
          default: true
        mountPath:
          description: The path that the host volume will be mounted to when in use. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
          example: /local/directory
          pattern: .*
        mountPropagation:
          $ref: '#/components/schemas/HostPathMountPropagation'
      type:
      - object
      - 'null'
    ServingPortProtocol:
      description: The protocol used by the port, defaults to http
      type:
      - string
      - 'null'
      enum:
      - http
      - grpc
    RunAsNonRoot:
      description: Force the container to run as a non-root user.
      type:
      - boolean
      - 'null'
      example: true
    RestartPolicy:
      description: Specify the restart policy of the workload pods. Default is empty, which is determine by the framework default
      type:
      - string
      - 'null'
      minLength: 1
      enum:
      - Always
      - Never
      - OnFailure
  parameters:
    PolicyScope:
      name: scope
      in: query
      required: true
      description: The scope that the policy relates to.
      schema:
        type: string
        enum:
        - tenant
        - cluster
        - department
        - project
    ValidateOnly:
      name: validateOnly
      in: query
      required: false
      description: Validate the given policy payload without applying it
      schema:
        type: boolean
    FilterByCluster:
      name: clusterId
      in: query
      description: Filter using the Universally Unique Identifier (UUID) of the cluster.
      required: false
      schema:
        type: string
        format: uuid
        example: d73a738f-fab3-430a-8fa3-5241493d7128
    IncludeFallbackPolicies:
      name: includeFallbackPolicies
      in: query
      required: false
      description: whether to include fallback policies in the list. Default to false.
      schema:
        type: boolean
    WorkloadType:
      name: workloadType
      in: query
      required: false
      description: Policy for a specific workload type.
      schema:
        type: string
        minLength: 1
        enum:
        - Workspace
        - Training
        - Distributed
        - Inference
        - DistributedInference
    ApproveClusterDeletion:
      name: approveClusterDeletion
      in: query
      required: false
      description: Required when modifying or deleting a policy if the tenant includes one or more clusters running version 2.20 or earlier. In such cases, the platform must delete the policy from the affected clusters. This flag indicates that the administrator approves this deletion.
      schema:
        type: boolean
    FilterByDepartment:
      name: departmentId
      in: query
      description: Filter using the department id.
      required: false
      schema:
        type: string
        example: '1'
    FilterByProject:
      name: projectId
      in: query
      description: project id to filter by
      required: false
      schema:
        type: string
        example: '1'
  responses:
    401Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Issuer is not familiar.
    403Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: You do not have sufficient permissions.
    404NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Resource id not found.
    503ServiceUnavailable:
      description: unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 503
            message: Please try again in few minutes.
    400BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Required parameter is missing
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer authentication
