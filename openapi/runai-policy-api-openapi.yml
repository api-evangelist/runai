      properties:
        matchExpressions:
          description: A list of node selector requirements by node's labels.
          type: array
          items:
            $ref: '#/components/schemas/MatchExpression'
    PortServiceTypeOptions:
      properties:
        options:
          type:
          - array
          - 'null'
          items:
            required:
