          - boolean
          - 'null'
        canEdit:
          description: Whether the value of the field is editable. default to true
          type:
          - boolean
          - 'null'
        min:
          description: The minimum value that the field can be assigned to.
          type:
          - number
          - 'null'
        max:
          description: The maximum value that the field can be assigned to.
          type:
          - number
          - 'null'
        step:
          description: The minimal difference between two values the field can be assigned to. For example, min=2, max=3, step=0.25 implies that the values the field can hold are 2, 2.25, 2.5 and 3.
          type:
          - number
          - 'null'
        defaultFrom:
          $ref: '#/components/schemas/DefaultFromRule'
      type:
      - object
      - 'null'
    DistributedInferenceRestartPolicy:
      description: 'Determines the behavior when a pod fails.

        - `RecreateGroupOnPodRestart`: Restarts all pods in the group if any pod fails.

        - `None`: No automatic restart behavior is applied.

        '
      type:
      - string
      - 'null'
      enum:
      - RecreateGroupOnPodRestart
      - None
      default: RecreateGroupOnPodRestart
    Ports:
      description: Set of container ports that the workload exposes.
      type:
      - array
      - 'null'
      items:
        $ref: '#/components/schemas/Port'
    ScopeType:
      type: string
      enum:
      - system
      - tenant
      - cluster
      - department
      - project
    DistributedInferencePolicyDefaultsAndRulesV2:
      properties:
        defaults:
          allOf:
          - $ref: '#/components/schemas/DistributedInferenceDefaultsV2'
          type:
          - object
          - 'null'
        rules:
          allOf:
          - $ref: '#/components/schemas/DistributedInferenceRulesV2'
          type:
          - object
          - 'null'
        imposedAssets:
          $ref: '#/components/schemas/DistributedInferenceImposedAssets'
        status:
          $ref: '#/components/schemas/PolicyValidationStatus'
      type:
      - object
      - 'null'
    ServingPortPort:
      description: The port that the container running the inference service exposes (mandatory).
      type:
      - integer
      - 'null'
      format: int32
      minimum: 1
      maximum: 65535
      example: 8000
    ConfigMapRules:
      properties:
        configMap:
          $ref: '#/components/schemas/StringRules'
        mountPath:
          $ref: '#/components/schemas/StringRules'
        subPath:
          $ref: '#/components/schemas/StringRules'
        defaultMode:
          $ref: '#/components/schemas/StringRules'
      type:
      - object
      - 'null'
    Stdin:
      description: Whether this container should allocate a buffer for stdin in the container runtime. If this is not set, reads from stdin in the container will always result in EOF
      type:
      - boolean
      - 'null'
    WorkingDir:
      description: Container's working directory. If not specified, the container runtime default will be used. This may be configured in the container image.
      type:
      - string
      - 'null'
      minLength: 1
      example: /home/myfolder
      pattern: .*
    DistributedFrameworkRules:
      allOf:
      - $ref: '#/components/schemas/StringRulesCommon'
      - $ref: '#/components/schemas/DistributedFrameworkOptions'
      type:
      - object
      - 'null'
    EnvironmentVariableConfigMap:
      description: Details of the configMap and key use to populate the environment variable
      properties:
        name:
          description: The name of the config-map resource. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
          example: my-config-map
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
        key:
          description: The key in the config-map resource. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
          example: MY_POSTGRES_SCHEMA
          pattern: .*
      type:
      - object
      - 'null'
    AnnotationsDefaults:
      properties:
        instances:
          $ref: '#/components/schemas/Annotations'
      type:
      - object
      - 'null'
    ConfigMap:
      properties:
        configMap:
          description: The name of the ConfigMap resource. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
        mountPath:
          description: Local path within the workload to which the ConfigMap will be mapped to. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
          pattern: .*
        subPath:
          description: Path within the volume from which the container's volume should be mounted.
          type:
          - string
          - 'null'
          minLength: 1
          pattern: .*
        defaultMode:
          $ref: '#/components/schemas/DefaultMode'
      type:
      - object
      - 'null'
    S3Common:
      properties:
        bucket:
          description: The name of the bucket. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
          example: my-bucket
        path:
          description: Local path within the workload to which the S3 bucket will be mapped. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
          example: /container/my-bucket
        url:
          description: The url of the S3 service provider. The default is the URL of the Amazon AWS S3 service.
          type:
          - string
          - 'null'
          minLength: 1
          example: https://s3.amazonaws.com
      type:
      - object
      - 'null'
    GpuRequestType:
      description: Sets the unit type for GPU resources requests. Stated in terms of portion or memory. Sets the unit type for other GPU request fields. If `gpuDevicesRequest > 1`, only `portion` is supported. If `gpuDeviceRequest = 1`, the request type can be stated as `portion` or `memory`.
      type:
      - string
      - 'null'
      minLength: 1
      enum:
      - portion
      - memory
    SshAuthMountPath:
      description: Specifies the directory where SSH keys are mounted. (applicable only for MPI)
      type:
      - string
      - 'null'
      default: /root/.ssh
      pattern: .*
    SecretFieldsUpdatable:
      properties:
        mountPath:
          description: Local path within the workload to which the Secret will be mapped to. (mandatory)
          type:
          - string
          - 'null'
          minLength: 1
        defaultMode:
          $ref: '#/components/schemas/DefaultMode'
      type:
      - object
      - 'null'
    DataVolumesDefaults:
      properties:
        attributes:
          $ref: '#/components/schemas/DataVolumeInstance'
        instances:
          $ref: '#/components/schemas/DataVolumeItems'
      type:
      - object
      - 'null'
    StringRulesOptions:
      properties:
        options:
          description: Set of options that the value of the field must be chosen from.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/StringOption'
    PolicySyncStatusOfCluster:
      required:
      - clusterId
      - status
      properties:
        clusterId:
          $ref: '#/components/schemas/ClusterId'
        status:
          description: Policy sync status of the cluster
          type: string
          enum:
          - Not ready
          - Applying
          - Failed
          - Ready
          - Pending deletion
          - Deleting
          - Deleted
          - Deletion failed
        errorMessage:
          description: In case sync failed, holds the error message received from the cluster
          type:
          - string
          - 'null'
      type: object
    InferencesMaxReplicasField:
      properties:
        maxReplicas:
          description: The maximum number of replicas for autoscaling. Defaults to minReplicas, or to 1 if minReplicas is set to 0
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
    TrainingPolicyV2:
      properties:
        meta:
          $ref: '#/components/schemas/PolicyMeta'
        policy:
          $ref: '#/components/schemas/TrainingPolicyDefaultsAndRulesV2'
        effective:
          $ref: '#/components/schemas/TrainingPolicyDefaultsAndRulesV2'
        effectiveUpdatedAt:
          $ref: '#/components/schemas/Timestamp'
      type:
      - object
      - 'null'
    AutoScalingRules:
      properties:
        metricThresholdPercentage:
          $ref: '#/components/schemas/NumberRules'
