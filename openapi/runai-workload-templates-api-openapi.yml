    ImagePullPolicy:
      description: Image pull policy. Defaults to `Always` if `:latest` tag is specified, otherwise it is `IfNotPresent`.
      type: string
      minLength: 1
      enum:
      - Always
      - Never
      - IfNotPresent
      nullable: true
    AllowPrivilegeEscalation:
      description: Allow the container running the workload and all launched processes to gain additional privileges after the workload starts. For more information consult the User Identity in Container guide at https://docs.run.ai/admin/runai-setup/config/non-root-containers/
      type: boolean
      example: false
      nullable: true
    TemplateMetaFields:
      required:
      - id
      - name
      - scopeType
      - scopeId
      - createdBy
      - createdAt
      - workloadType
      properties:
        id:
          $ref: '#/components/schemas/TemplateId'
        name:
          $ref: '#/components/schemas/TemplateName'
        description:
          $ref: '#/components/schemas/TemplateDescription'
        workloadType:
          $ref: '#/components/schemas/WorkloadType'
        scopeType:
          $ref: '#/components/schemas/ScopeType'
        scopeId:
          $ref: '#/components/schemas/ScopeId'
        clusterId:
          $ref: '#/components/schemas/ClusterIdOptional'
        departmentId:
          $ref: '#/components/schemas/DepartmentIdOptional'
        projectId:
          $ref: '#/components/schemas/ProjectIdOptional'
        createdBy:
          description: The user who created the template
          type: string
          example: test@lab.com
        createdAt:
          description: The creation time of the template.
          type: string
          format: date-time
          example: '2022-01-01T03:49:52.531Z'
        updatedBy:
          description: The user who recently updated the template
          type: string
          nullable: true
          example: test@lab.com
        updatedAt:
          description: The time of the recent update.
          type: string
          nullable: true
          format: date-time
          example: '2022-01-01T03:49:52.531Z'
    HostPathItems:
      description: Set of host paths to use in the workload.
      type: array
      items:
        $ref: '#/components/schemas/HostPathInstance'
      nullable: true
    ClaimInfo:
      description: Claim information for the newly created PVC. The information should not be provided when attempting to use existing PVC.
      properties:
        size:
          $ref: '#/components/schemas/PvcClaimSize'
        storageClass:
          description: Storage class name to associate with the PVC. This parameter may be omitted if there is a single storage class in the system, or you are using the default storage class. For more information, see [Storage class](https://kubernetes.io/docs/concepts/storage/storage-classes).
          type: string
          minLength: 1
          example: my-storage-class
          nullable: true
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
        accessModes:
          $ref: '#/components/schemas/PvcAccessModes'
        volumeMode:
          $ref: '#/components/schemas/PvcVolumeMode'
        addedAttrValues:
          $ref: '#/components/schemas/PvcAddedAttrValues'
      nullable: true
      type: object
    TemplateCreationMetaFields:
      required:
      - name
      - scopeType
      properties:
        name:
          $ref: '#/components/schemas/TemplateName'
        description:
          $ref: '#/components/schemas/TemplateDescription'
        scopeType:
          $ref: '#/components/schemas/ScopeType'
        scopeId:
          $ref: '#/components/schemas/ScopeIdOptional'
    DistributedInferenceServingPort:
      description: Defines the configuration for the inference serving endpoint. This determines how applications or services can send inference requests to the workload.
      allOf:
      - $ref: '#/components/schemas/DistributedInferenceServingPortContainerAndProtocol'
      - $ref: '#/components/schemas/DistributedInferenceServingPortAccess'
      nullable: true
      type: object
    SlotsPerWorker:
      description: Specifies the number of slots per worker used in hostfile. Defaults to 1. (applicable only for MPI)
      type: integer
      minimum: 1
      nullable: true
      default: 1
    ServingPort:
      description: A port for accessing the inference service
      allOf:
      - $ref: '#/components/schemas/ServingPortContainerAndProtocol'
      - $ref: '#/components/schemas/ServingPortAccess'
      nullable: true
      type: object
    HostPathMountPropagation:
      description: Share this volumes mount with other containers. If set to HostToContainer, this volume mount will receive all subsequent mounts that are mounted to this volume or any of its subdirectories. In case of multiple hostPath entries, this field should have the same value for all of them.
      type: string
      enum:
      - None
      - HostToContainer
      nullable: true
    WorkspaceTemplatePatchRequest:
      allOf:
      - $ref: '#/components/schemas/TemplatePatchMeta'
      - properties:
          spec:
            $ref: '#/components/schemas/WorkspaceTemplateSpec'
      - $ref: '#/components/schemas/FieldsToClear'
      - $ref: '#/components/schemas/TemplateAssets'
    NumWorkers:
      description: the number of workers that will be allocated for running the workload.
      type: integer
      minimum: 1
      nullable: true
    DistributedInferenceRestartPolicy:
      description: 'Determines the behavior when a pod fails.

        - `RecreateGroupOnPodRestart`: Restarts all pods in the group if any pod fails.

        - `None`: No automatic restart behavior is applied.

        '
      type: string
      enum:
      - RecreateGroupOnPodRestart
      - None
      nullable: true
      default: RecreateGroupOnPodRestart
    CountResponse:
      type: object
      required:
      - count
      properties:
        count:
          type: integer
          format: int64
          example: 1
    StorageInstanceName:
      properties:
        name:
          description: unique name to identify the instance. primarily used for policy locked rules.
          type: string
          minLength: 1
          example: storage-instance-a
          nullable: true
      nullable: true
      type: object
    EnvironmentVariables:
      description: Set of environment variables to populate into the container running the workload.
      type: array
      items:
        $ref: '#/components/schemas/EnvironmentVariable'
      nullable: true
    ServingPortContainerAndProtocol:
      properties:
        container:
          description: The port that the container running the inference service exposes (mandatory).
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          example: 8080
          nullable: true
        protocol:
          $ref: '#/components/schemas/ServingPortProtocol'
    TemplateCreationMeta:
      required:
      - meta
      properties:
        meta:
          $ref: '#/components/schemas/TemplateCreationMetaFields'
    CpuCoreRequest:
      description: CPU units to allocate for the created workload (0.5, 1, .etc). The workload will receive at least this amount of CPU. Note that the workload will not be scheduled unless the system can guarantee this amount of CPUs to the workload.
      format: double
      type: number
      example: 0.5
      nullable: true
      minimum: 0
    Preemptibility:
      description: Specifies whether the workload can be preempted by higher-priority workloads. Valid values are preemptible and non-preemptible. If explicitly set, this value takes precedence. If not set, the system derives the preemptibility from the priorityClassName field, ensuring backward compatibility. Each workload type has a default preemptibility. To view the default preemptibility for each workload type, use the GET /workload-types endpoint.
      type: string
      minLength: 1
      enum:
      - preemptible
      - non-preemptible
      nullable: true
    RelatedUrls:
      description: Set of URLs that are related to the workload.
      type: array
      items:
        $ref: '#/components/schemas/RelatedUrl'
      nullable: true
    DistributedInferenceWorkerSpecFields:
      properties:
        worker:
          description: Defines the pod specification for the workers. Required only if the number of workers is greater than 0.
          allOf:
          - $ref: '#/components/schemas/DistributedInferenceLeaderWorkerSpec1'
          nullable: true
          type: object
    SupplementalGroups:
      description: Comma separated list of groups that the user running the container belongs to, in addition to the group indicated by runAsGid. Use only when the source uid/gid of the environment asset is not `fromTheImage`, and `overrideUidGidInWorkspace` is enabled. Using an empty string implies reverting the supplementary groups of the image.
      type: string
      example: 2,3,5,8
      nullable: true
      pattern: .*
    DataVolume:
      properties:
        id:
          description: The unique identifier of the data volume. (mandatory)
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
          nullable: true
        mountPath:
          description: The path where the data volume will be mounted. (mandatory)
          type: string
          example: /mnt/data
          nullable: true
          pattern: .*
      nullable: true
      type: object
    ConfigMapItems:
      description: Set of config map volumes to use in the workload
      type: array
      items:
        $ref: '#/components/schemas/ConfigMapInstance'
      nullable: true
    CleanPodPolicy:
      description: The policy describes how to deal with pods when the job is finished.
      type: string
      enum:
      - None
      - All
      - Running
      nullable: true
    PolicyRuleEnum:
      description: Indicates which validation rule (e.g., min, max, step, options, required, canEdit, canAdd) conflicted with policy restrictions, causing the asset or template to be rejected.
      type: string
      nullable: true
      enum:
      - min
      - max
      - step
      - options
      - required
      - canEdit
      - canAdd
      - locked
    DistributedTemplateCreationRequest:
      allOf:
      - $ref: '#/components/schemas/TemplateCreationMeta'
      - type: object
        properties:
          spec:
            $ref: '#/components/schemas/DistributedTemplateSpec'
      - $ref: '#/components/schemas/TemplateAssets'
      - type: object
        properties:
          masterSpecSameAsWorker:
            $ref: '#/components/schemas/MasterSpecSameAsWorker'
          master:
            $ref: '#/components/schemas/TemplateMasterSection'
        nullable: true
    DistributedTemplatePatchRequest:
      allOf:
      - $ref: '#/components/schemas/TemplatePatchMeta'
      - type: object
        properties:
          spec:
            $ref: '#/components/schemas/DistributedTemplateSpec'
      - $ref: '#/components/schemas/TemplateAssets'
      - type: object
        properties:
          masterSpecSameAsWorker:
            $ref: '#/components/schemas/MasterSpecSameAsWorker'
          master:
            $ref: '#/components/schemas/TemplateMasterSection'
        nullable: true
      - $ref: '#/components/schemas/FieldsToClear'
