    FieldsToClear:
      description: array of xpath expression with fields that their values should be cleared
      type: object
      properties:
        fieldsToClear:
          items:
            type: string
            example: spec.image
            minLength: 1
      nullable: true
    PvcVolumeMode:
      description: Default volume mode for the PVC. Choose between Filesystem (default) or Block.
      type: string
      enum:
      - Filesystem
      - Block
      nullable: true
    Label:
      description: Label details to be populated into the container.
      properties:
        name:
          description: The name of the label (mandatory)
          type: string
          minLength: 1
          maxLength: 63
          example: stage
          nullable: true
          pattern: .*
        value:
          description: The value of the label.
          type: string
          example: initial-research
          nullable: true
          pattern: .*
        exclude:
          description: Use 'true' in case the label is defined in defaults of the policy, and you wish to exclude it from the workload.
          type: boolean
          example: false
          nullable: true
      nullable: true
      type: object
    TemplateAssets: {}
    DistributedInferenceStartupPolicyField:
      properties:
        startupPolicy:
          $ref: '#/components/schemas/DistributedInferenceStartupPolicy'
      nullable: true
      type: object
    GitItems:
      description: Set of git repositories to use in the workload.
      type: array
      items:
        $ref: '#/components/schemas/GitInstance'
      nullable: true
    SeccompProfileType:
      description: Indicates which kind of seccomp profile will be applied to the container. The options are a. `RuntimeDefault` - the container runtime default profile should be used. b. `Unconfined` - no profile should be applied. c. `Localhost` is not yet supported by Run:ai.
      type: string
      enum:
      - RuntimeDefault
      - Unconfined
      - Localhost
      nullable: true
    ServingConfigurationField:
      properties:
        servingConfiguration:
          $ref: '#/components/schemas/ServingConfiguration'
    RestartPolicy:
      description: Specify the restart policy of the workload pods. Default is empty, which is determine by the framework default
      type: string
      minLength: 1
      enum:
      - Always
      - Never
      - OnFailure
      nullable: true
    DefaultMode:
      type: string
      description: 'File permission mode in octal string format. This value must be a 4-digit octal number, representing the default file mode when mounting a Secret or ConfigMap as a volume.

        '
      minLength: 4
      maxLength: 4
      example: '0644'
      pattern: 0[0-7]{3}
      nullable: true
    Tolerations:
      description: Set of tolerations to apply to the workload.
      type: array
      items:
        $ref: '#/components/schemas/Toleration'
      nullable: true
    TemplatesListResponse:
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SupersetTemplate'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    Nfs:
      properties:
        path:
          description: Path that is exported by the NFS server (mandatory). For more information, see [NFS](https://kubernetes.io/docs/concepts/storage/volumes#nfs).
          type: string
          minLength: 1
          example: /container/nfs
          nullable: true
          pattern: .*
        readOnly:
          description: Force the NFS export to be mounted with read-only permissions.
          type: boolean
          default: true
          nullable: true
        server:
          description: The hostname or IP address of the NFS server. (mandatory)
          type: string
          minLength: 1
          example: my.nfs.com
          nullable: true
          pattern: .*
        mountPath:
          description: The path that the NFS volume will be mounted to when in use. (mandatory)
          type: string
          minLength: 1
          example: /local/nfs
          nullable: true
          pattern: .*
      nullable: true
      type: object
