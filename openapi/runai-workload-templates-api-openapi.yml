          type:
          - string
          - 'null'
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        mountPath:
          description: The path where the data volume will be mounted. (mandatory)
          type:
          - string
          - 'null'
          example: /mnt/data
          pattern: .*
      type:
      - object
      - 'null'
