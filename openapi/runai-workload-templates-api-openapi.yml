      allOf:
      - $ref: '#/components/schemas/TemplateCreationMeta'
      - properties:
          spec:
            $ref: '#/components/schemas/TrainingTemplateSpec'
      - $ref: '#/components/schemas/TemplateAssets'
    MasterSpecSameAsWorker:
      description: used for distributed workloads to indicate that the master spec should be the same as the worker spec. in this case, masterSpec should not be specified.
      type: boolean
      nullable: true
    MpiLauncherCreationPolicy:
      description: Define whether the MPI Launcher is created in parallel with the workers, or if its creation is postponed until all workers are in  Ready state. This prevents failures when the launcher attempts to connect to workers that are not yet ready.
      type: string
      enum:
      - AtStartup
      - WaitForWorkersReady
      nullable: true
    ScopeType:
      type: string
      enum:
      - system
      - tenant
      - cluster
      - department
      - project
    SupersetTemplate:
      allOf:
      - $ref: '#/components/schemas/TemplateMeta'
      - type: object
        properties:
          runnable:
            $ref: '#/components/schemas/RunnableInfo'
          spec:
            $ref: '#/components/schemas/SupersetSpec'
          assets:
            $ref: '#/components/schemas/TemplateAssetsIdsOptional'
          masterSpecSameAsWorker:
            $ref: '#/components/schemas/MasterSpecSameAsWorker'
          master:
            $ref: '#/components/schemas/TemplateMasterSection'
          combinedSpec:
            $ref: '#/components/schemas/SupersetSpec'
          combinedMasterSpec:
            $ref: '#/components/schemas/MasterTemplateSpec'
        nullable: true
      - $ref: '#/components/schemas/TemplateComplianceInfo'
    Probes:
      description: Probes are used to determine if the container is healthy and ready to accept traffic.
      type: object
      properties:
        readiness:
          $ref: '#/components/schemas/Probe'
      nullable: true
    S3Instance:
      allOf:
      - $ref: '#/components/schemas/StorageInstanceName'
      - $ref: '#/components/schemas/S3Common'
      - $ref: '#/components/schemas/S3AccessKey'
      - $ref: '#/components/schemas/ExcludeField'
      nullable: true
      type: object
    S3Items:
      description: Set of s3 buckets to use in the workload.
      type: array
      items:
        $ref: '#/components/schemas/S3Instance'
      nullable: true
    EmptyDirInstance:
      allOf:
      - $ref: '#/components/schemas/StorageInstanceName'
      - $ref: '#/components/schemas/EmptyDir'
      - $ref: '#/components/schemas/ExcludeField'
      nullable: true
      type: object
    MaxReplicas:
      description: the upper limit for the number of worker pods that can be set by the autoscaler. Cannot be smaller than MinReplicas. (applicable only for PyTorch)
      type: integer
      nullable: true
    NodeType3:
      description: Nodes (machines), or a group of nodes on which the workload will run. To use this feature, your Administrator will need to label nodes. For more information, see [Group Nodes](https://docs.run.ai/latest/admin/researcher-setup/limit-to-node-group). When using this flag with with Project-based affinity, it refines the list of allowable node groups set in the Project. For more information, see [Projects](https://docshub.run.ai/guides/platform-management/aiinitiatives/organization/projects).
      type: string
      minLength: 1
      example: my-node-type
      nullable: true
      pattern: .*
    ScaleDownDelayField:
      properties:
        scaleDownDelaySeconds:
          description: The minimum amount of time (in seconds) that a replica will remain active after a scale-down decision
          type: integer
          format: int32
          minimum: 0
          maximum: 3600
          nullable: true
    ExtendedResources:
      description: Extended resources and their quantity.
      type: array
      items:
        $ref: '#/components/schemas/ExtendedResource'
      nullable: true
    DistributedInferenceServingPortContainerAndProtocol:
      properties:
        port:
          description: The port exposed by the container running the distributed inference service.
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          example: 8080
          nullable: true
        protocol:
          $ref: '#/components/schemas/DistributedInferenceServingPortProtocol'
    TemplatePatchMetaFields:
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/TemplateNameOptional'
        description:
          $ref: '#/components/schemas/TemplateDescription'
      nullable: true
      type: object
    TrainingTemplateUpdateRequest:
      allOf:
      - $ref: '#/components/schemas/TemplateUpdateMeta'
      - properties:
          spec:
            $ref: '#/components/schemas/TrainingTemplateSpec'
      - $ref: '#/components/schemas/TemplateAssets'
