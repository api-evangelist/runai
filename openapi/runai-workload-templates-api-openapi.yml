          minimum: 0
    Parallelism:
      description: Used with Hyperparameter Optimization. Specifies the maximum number of pods the workload should run at any given time (applicable to standard training only).
      type:
      - integer
      - 'null'
      format: int32
      example: 1
    ScaleToZeroRetentionField:
      properties:
        scaleToZeroRetentionSeconds:
          description: The minimum amount of time (in seconds) that the last replica will remain active after a scale-to-zero decision. Defaults to 0. Available only if minReplicas is set to 0
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
          maximum: 3600
    TemplateMeta:
      required:
      - meta
      properties:
        meta:
